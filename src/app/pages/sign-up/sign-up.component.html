<app-toolbar></app-toolbar>
<div class="register-container">
  <h2>Sign Up</h2>
  <form (ngSubmit)="register()">
    <div class="row">
      <div class="input-group">
        <label for="name">Name:</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" />
      </div>
      <div class="input-group">
        <label for="lastname">Last Name:</label>
        <input id="lastname" type="text" [(ngModel)]="lastName" name="lastName" />
      </div>
      <div class="input-group">
        <label for="typeUser">Type User:</label>
        <input id="typeUser" type="text" [(ngModel)]="typeUser" name="typeUser" />
      </div>
    </div>

    <div class="input-group">
      <label for="email">Email:</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" />
    </div>

    <div class="row">
      <div class="input-group">
        <label for="password">Password:</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" />
      </div>
      <div class="input-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" />
      </div>
    </div>

    <button class="register-btn" type="submit">Register</button>
  </form>
</div>
