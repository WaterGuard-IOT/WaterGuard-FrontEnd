<app-toolbar></app-toolbar>

<div class="register-wrapper">
  <div class="register-container">
    <h2>Registro</h2>
    <form (ngSubmit)="register()">
      <div class="input-group">
        <label for="username">Usuario:</label>
        <input id="username" type="text" [(ngModel)]="username" name="username" required />
      </div>

      <div class="input-group">
        <label for="email">Email:</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="input-group">
        <label for="password">Contraseña:</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required />
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirmar Contraseña:</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />
      </div>

      <button class="register-btn" type="submit">Registrarse</button>

      <div class="login-link">
        ¿Ya tienes una cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </div>
    </form>
  </div>
</div>
