<app-toolbar></app-toolbar>
<div class="login-container">
  <h1>Login</h1>
  <form (ngSubmit)="login()">
    <label for="username">Usuario</label>
    <input
      type="text"
      id="username"
      [(ngModel)]="username"
      name="username"
      placeholder="Nombre de usuario"
      required
    />

    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Contraseña"
      required
    />

    <div class="links">
      <a href="#" class="forgot">¿Has olvidado tu contraseña?</a><br />
      <span>No tienes una cuenta? <a class="signup-link" routerLink="/signup">Regístrate ahora</a></span>
    </div>

    <button type="submit" class="signup-button">Iniciar Sesión</button>
  </form>
</div>
