<app-toolbar></app-toolbar>

<div class="profile-wrapper">
  <div class="profile-container">
    <div class="profile-image">
      <span class="material-icons avatar-icon">account_circle</span>
    </div>

    <div class="profile-details">
      <h2><span class="material-icons">person</span> Mi Perfil</h2>

      <div class="form-group">
        <label for="username">
          <span class="material-icons icon-label">badge</span>
          Nombre de Usuario
        </label>
        <input type="text" id="username" [value]="username || 'N/A'" readonly />
      </div>

      <div class="form-group">
        <label for="email">
          <span class="material-icons icon-label">email</span>
          Correo Electrónico
        </label>
        <input type="email" id="email" [value]="email || 'N/A'" readonly />
      </div>
    </div>
  </div>

  <div class="profile-footer">
    <img src="assets/images/logo.png" alt="WaterGuard Logo" />
  </div>
</div>
