<app-toolbar></app-toolbar>

<div class="reports-container">
  <!-- Resumen General -->
  <div class="card">
    <h2>Resumen General</h2>

    <div class="summary-card green">
      <div class="icon">
        <img src="assets/images/icon-tank.png" alt="Tanque" />
      </div>
      <div class="content">
        <div><strong>{{ waterLevel }}%</strong> Nivel</div>
        <div>Última medición</div>
      </div>
    </div>

    <div class="summary-card blue">
      <div class="icon">
        <img src="assets/images/icon-consume.png" alt="Consumo" />
      </div>
      <div class="content">
        <div><strong>{{ waterStatus }}</strong></div>
        <div>Calidad del agua</div>
      </div>
    </div>

    <div class="summary-card red">
      <div class="icon">
        <img src="assets/images/icon-alert.png" alt="Fugas" />
      </div>
      <div class="content">
        <div><strong>{{ totalTanks }}</strong> Tanques</div>
        <div>Total registrados</div>
      </div>
    </div>
  </div>

  <!-- Alertas y Notificaciones -->
  <div class="card">
    <h2>Alertas y Notificaciones</h2>
    <ul class="alert-list" *ngIf="alerts.length > 0; else noAlerts">
      <li *ngFor="let alert of alerts">
        <span class="material-icons alert-icon">warning</span>
        {{ alert }}
      </li>
    </ul>
    <ng-template #noAlerts>
      <div class="no-alerts">
        <span class="material-icons">check_circle</span>
        No hay alertas activas
      </div>
    </ng-template>
  </div>

  <!-- Acciones rápidas -->
  <div class="card">
    <h2>Acciones rápidas</h2>

    <button class="action-btn" routerLink="/home">
      Ver Consumo detallado <span class="arrow">➔</span>
    </button>

    <button class="action-btn" routerLink="/device">
      Ver dispositivo <span class="arrow">➔</span>
    </button>
  </div>
</div>
