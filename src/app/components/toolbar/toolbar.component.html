<div class="toolbar">
  <div class="left-section">
    <img src="assets/images/logo.png" alt="Logo" class="logo" />
    <span class="app-name">WaterGuard</span>
  </div>

  <div class="right-section" *ngIf="showIcons">
    <button routerLink="/home" title="Inicio">
      <img src="assets/images/icon-home.png" alt="Home" />
    </button>
    <button routerLink="/reports" title="Reports">
      <img src="assets/images/icon-docs.png" alt="Reports" />
    </button>
    <button routerLink="/settings" title="Configuración">
      <img src="assets/images/icon-settings.png" alt="Settings" />
    </button>
    <button routerLink="/profile" title="Perfil" class="profile-button">
      <img src="assets/images/icon-profile.png" alt="Profile" />
    </button>
  </div>
</div>
