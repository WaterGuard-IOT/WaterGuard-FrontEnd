<div class="toolbar">
  <div class="left-section">
    <img src="assets/images/logo.png" alt="Logo" class="logo" />
    <span class="app-name">WaterGuard</span>
  </div>

  <div class="right-section" *ngIf="showIcons">
    <button routerLink="/home" title="Inicio">
      <span class="material-icons">home</span>
    </button>
    <button routerLink="/reports" title="Reportes">
      <span class="material-icons">description</span>
    </button>
    <button routerLink="/settings" title="Configuración">
      <span class="material-icons">settings</span>
    </button>
    <button routerLink="/profile" title="Perfil" class="profile-button">
      <span class="material-icons">person</span>
    </button>
  </div>
</div>
